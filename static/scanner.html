<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edge Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans p-4">
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-md overflow-hidden">
        <div class="p-4 bg-blue-600 text-white flex justify-between items-center">
            <h1 class="text-xl font-bold">Edge Scanner</h1>
            <a href="/" class="text-sm underline">Dashboard</a>
        </div>
        
        <div class="p-4">
            <!-- Step Indicator -->
            <div id="step-indicator" class="text-center font-bold text-blue-700 mb-4 text-lg">
                Step 1: Snap Front Photo
            </div>

            <!-- Capture Buttons -->
            <div id="capture-section" class="mb-6 space-y-3">
                <label id="lbl-front" class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-lg cursor-pointer text-center shadow">
                    Snap Front Photo
                    <input type="file" id="input-front" accept="image/*" capture="environment" class="hidden">
                </label>

                <label id="lbl-back" class="hidden block w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-lg cursor-pointer text-center shadow">
                    Snap Back Photo
                    <input type="file" id="input-back" accept="image/*" capture="environment" class="hidden">
                </label>

                <label id="lbl-upload-back" class="hidden block w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-lg cursor-pointer text-center shadow text-sm">
                    Or Upload Back Image from Gallery
                    <input type="file" id="input-upload-back" accept="image/*" class="hidden">
                </label>

                <label id="lbl-qr" class="hidden block w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-lg cursor-pointer text-center shadow">
                    Snap QR Label (zoom in close)
                    <input type="file" id="input-qr" accept="image/*" capture="environment" class="hidden">
                </label>

                <label id="lbl-upload-qr" class="hidden block w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-lg cursor-pointer text-center shadow text-sm">
                    Or Upload QR Label from Gallery
                    <input type="file" id="input-upload-qr" accept="image/*" class="hidden">
                </label>

                <button id="btn-retake" class="hidden w-full bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-4 rounded-lg">
                    Retake Photos
                </button>
            </div>

            <!-- Previews -->
            <div class="flex gap-2 mb-6">
                <div id="preview-front" class="flex-1 h-28 bg-gray-200 rounded border border-gray-300 flex items-center justify-center overflow-hidden relative shadow-inner">
                    <span class="text-xs text-gray-500">Front</span>
                </div>
                <div id="preview-back" class="flex-1 h-28 bg-gray-200 rounded border border-gray-300 flex items-center justify-center overflow-hidden relative shadow-inner">
                    <span class="text-xs text-gray-500">Back</span>
                </div>
                <div id="preview-qr" class="flex-1 h-28 bg-gray-200 rounded border border-gray-300 flex items-center justify-center overflow-hidden relative shadow-inner">
                    <span class="text-xs text-gray-500">QR</span>
                </div>
            </div>

            <!-- Processing Spinner -->
            <div id="processing" class="hidden text-center py-8">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-blue-600 border-t-transparent mb-4"></div>
                <p class="text-blue-700 font-bold text-lg">Reading QR label...</p>
                <p class="text-gray-500 text-sm mt-1">Looking for the QR code in your close-up shot</p>
            </div>

            <!-- Results Section -->
            <div id="results-section" class="hidden">
                <div id="parsed-data" class="mb-4 p-4 bg-green-50 border border-green-200 rounded-lg text-sm">
                    <h3 class="font-bold text-green-800 mb-3 border-b border-green-200 pb-2 flex items-center gap-2">
                        Device Identified
                    </h3>
                    <div class="grid grid-cols-2 gap-y-3 gap-x-2 text-xs">
                        <div><span class="font-semibold text-gray-500 block">Model</span> <span id="val-model" class="font-medium text-gray-900 text-sm"></span></div>
                        <div><span class="font-semibold text-gray-500 block">Color</span> <span id="val-color" class="font-medium text-gray-900 text-sm"></span></div>
                        <div><span class="font-semibold text-gray-500 block">Capacity</span> <span id="val-capacity" class="font-medium text-gray-900 text-sm"></span></div>
                        <div><span class="font-semibold text-gray-500 block">Serial</span> <span id="val-serial" class="font-medium text-gray-900 text-sm"></span></div>
                        <div class="col-span-2"><span class="font-semibold text-gray-500 block">IMEI</span> <span id="val-imei" class="font-medium text-gray-900 text-sm"></span></div>
                        <div><span class="font-semibold text-gray-500 block">iOS</span> <span id="val-ios" class="font-medium text-gray-900 text-sm"></span></div>
                        <div><span class="font-semibold text-gray-500 block">Battery</span> <span id="val-battery" class="font-medium text-gray-900 text-sm"></span></div>
                    </div>
                </div>

                <!-- Error state for QR not found -->
                <div id="qr-error" class="hidden mb-4 p-4 bg-red-50 border border-red-200 rounded-lg text-sm">
                    <h3 class="font-bold text-red-800 mb-2">QR Code Not Found</h3>
                    <p class="text-red-700 text-sm" id="qr-error-msg">Could not detect a QR code. Zoom in closer on the label and try again.</p>
                </div>

                <!-- Custom Remarks -->
                <div class="mb-4">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Custom Remarks</label>
                    <textarea id="custom-remarks" rows="3" class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-blue-500 focus:border-blue-500 shadow-sm" placeholder="e.g. Won't turn on, water damage..."></textarea>
                </div>

                <!-- Submit Button -->
                <button id="btn-submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-4 rounded-xl shadow-lg text-lg">
                    Submit to Inventory
                </button>
            </div>
        </div>
    </div>

    <script src="/static/js/scanner.js?v=11"></script>
</body>
</html>
